name: Build DualApp999 v1.5 APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [dualapp999-build-20260727]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare v1.5 source
        run: |
          base64 -d dualapp-build/project-v1.2.zip.b64 > /tmp/project.zip
          unzip -q /tmp/project.zip -d /tmp/project
          cd /tmp/project/dualapp999-v1.2-project
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/kuku/dualapp/MainActivity.java')
          s=p.read_text()

          s=s.replace('import android.widget.EditText;\n', 'import android.widget.EditText;\nimport android.widget.ImageView;\nimport android.widget.ScrollView;\n')
          s=s.replace('    private TextView selectedView;\n', '''    private TextView selectedView;\n    private TextView clonedHeaderView;\n    private LinearLayout clonedAppsList;\n    private ScrollView clonedAppsScroll;\n    private LinearLayout clonedBatchActions;\n    private Button toggleClonedButton;\n    private boolean clonedAppsExpanded = false;\n''')
          s=s.replace('''        super.onCreate(savedInstanceState);\n        setContentView(createContentView());''', '''        super.onCreate(savedInstanceState);\n        getWindow().setStatusBarColor(Color.WHITE);\n        getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);\n        setContentView(createContentView());''')

          old='''        selectedView = new TextView(this);\n        selectedView.setText("已选择 0 个应用");'''
          new='''        LinearLayout clonedHeaderRow = new LinearLayout(this);\n        clonedHeaderRow.setOrientation(LinearLayout.HORIZONTAL);\n        clonedHeaderRow.setGravity(Gravity.CENTER_VERTICAL);\n        clonedHeaderRow.setPadding(dp(12), dp(3), dp(8), dp(3));\n\n        clonedHeaderView = new TextView(this);\n        clonedHeaderView.setText("已双开应用 (0)");\n        clonedHeaderView.setTextSize(14);\n        clonedHeaderView.setTextColor(Color.rgb(35, 35, 35));\n        clonedHeaderView.setGravity(Gravity.CENTER_VERTICAL);\n        clonedHeaderRow.addView(clonedHeaderView, new LinearLayout.LayoutParams(0, dp(42), 1f));\n\n        toggleClonedButton = new Button(this);\n        toggleClonedButton.setText("展开");\n        toggleClonedButton.setAllCaps(false);\n        toggleClonedButton.setTextSize(12);\n        clonedHeaderRow.addView(toggleClonedButton, new LinearLayout.LayoutParams(dp(78), dp(42)));\n        root.addView(clonedHeaderRow, new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT, dp(48)));\n\n        clonedBatchActions = new LinearLayout(this);\n        clonedBatchActions.setOrientation(LinearLayout.HORIZONTAL);\n        clonedBatchActions.setPadding(dp(10), 0, dp(10), dp(4));\n        Button selectAllClonedButton = actionButton("全选已双开");\n        Button clearClonedButton = actionButton("清空选择");\n        clonedBatchActions.addView(selectAllClonedButton, weightedButtonParams());\n        clonedBatchActions.addView(clearClonedButton, weightedButtonParams());\n        clonedBatchActions.setVisibility(View.GONE);\n        root.addView(clonedBatchActions, new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT, dp(54)));\n\n        clonedAppsScroll = new ScrollView(this);\n        clonedAppsScroll.setFillViewport(true);\n        clonedAppsScroll.setVisibility(View.GONE);\n        clonedAppsList = new LinearLayout(this);\n        clonedAppsList.setOrientation(LinearLayout.VERTICAL);\n        clonedAppsList.setPadding(dp(8), 0, dp(8), dp(4));\n        clonedAppsScroll.addView(clonedAppsList, new ScrollView.LayoutParams(\n                ScrollView.LayoutParams.MATCH_PARENT, ScrollView.LayoutParams.WRAP_CONTENT));\n        root.addView(clonedAppsScroll, new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT, dp(230)));\n\n        toggleClonedButton.setOnClickListener(v -> {\n            clonedAppsExpanded = !clonedAppsExpanded;\n            toggleClonedButton.setText(clonedAppsExpanded ? "收起" : "展开");\n            clonedBatchActions.setVisibility(clonedAppsExpanded ? View.VISIBLE : View.GONE);\n            clonedAppsScroll.setVisibility(clonedAppsExpanded ? View.VISIBLE : View.GONE);\n            if (clonedAppsExpanded) updateClonedAppsList();\n        });\n        selectAllClonedButton.setOnClickListener(v -> {\n            for (AppEntry app : apps) if (app.cloned) app.selected = true;\n            adapter.notifyDataSetChanged();\n            updateSelectionState();\n            updateClonedAppsList();\n        });\n        clearClonedButton.setOnClickListener(v -> {\n            for (AppEntry app : apps) if (app.cloned) app.selected = false;\n            adapter.notifyDataSetChanged();\n            updateSelectionState();\n            updateClonedAppsList();\n        });\n\n        selectedView = new TextView(this);\n        selectedView.setText("已选择 0 个应用");'''
          assert old in s
          s=s.replace(old,new)

          s=s.replace('adapter = new AppListAdapter(this, apps, this::updateSelectionState);', '''adapter = new AppListAdapter(this, apps, () -> {\n            updateSelectionState();\n            if (clonedAppsExpanded) updateClonedAppsList();\n        });''')

          s=s.replace('''                setActionsEnabled(true);\n                updateSelectionState();\n            });''', '''                setActionsEnabled(true);\n                updateSelectionState();\n                updateClonedAppsList();\n            });''', 1)
          s=s.replace('''                adapter.notifyDataSetChanged();\n                statusView.setText("状态已刷新 · 双开用户：" + cloneUserId);''', '''                adapter.notifyDataSetChanged();\n                updateClonedAppsList();\n                statusView.setText("状态已刷新 · 双开用户：" + cloneUserId);''')
          s=s.replace('''                adapter.clearSelections();\n                adapter.notifyDataSetChanged();\n                setActionsEnabled(true);''', '''                adapter.clearSelections();\n                adapter.notifyDataSetChanged();\n                updateClonedAppsList();\n                setActionsEnabled(true);''')

          marker='    private void updateSelectionState() {\n'
          method='''    private void updateClonedAppsList() {\n        if (clonedAppsList == null || clonedHeaderView == null) return;\n        clonedAppsList.removeAllViews();\n        List<AppEntry> clonedApps = new ArrayList<>();\n        for (AppEntry app : apps) if (app.cloned) clonedApps.add(app);\n        clonedHeaderView.setText("已双开应用 (" + clonedApps.size() + ")");\n\n        if (clonedApps.isEmpty()) {\n            TextView empty = new TextView(this);\n            empty.setText("暂无已双开的应用");\n            empty.setTextSize(13);\n            empty.setTextColor(Color.rgb(130, 130, 130));\n            empty.setPadding(dp(12), dp(12), dp(12), dp(12));\n            clonedAppsList.addView(empty);\n            return;\n        }\n\n        for (AppEntry app : clonedApps) {\n            LinearLayout row = new LinearLayout(this);\n            row.setOrientation(LinearLayout.HORIZONTAL);\n            row.setGravity(Gravity.CENTER_VERTICAL);\n            row.setPadding(dp(4), dp(4), dp(4), dp(4));\n\n            CheckBox checkBox = new CheckBox(this);\n            checkBox.setChecked(app.selected);\n            row.addView(checkBox, new LinearLayout.LayoutParams(dp(48), dp(54)));\n\n            ImageView icon = new ImageView(this);\n            icon.setImageDrawable(app.icon);\n            LinearLayout.LayoutParams iconParams = new LinearLayout.LayoutParams(dp(42), dp(42));\n            iconParams.setMargins(0, 0, dp(10), 0);\n            row.addView(icon, iconParams);\n\n            LinearLayout textBlock = new LinearLayout(this);\n            textBlock.setOrientation(LinearLayout.VERTICAL);\n            textBlock.setGravity(Gravity.CENTER_VERTICAL);\n            TextView name = new TextView(this);\n            name.setText(app.label);\n            name.setTextSize(14);\n            name.setTextColor(Color.rgb(35, 35, 35));\n            TextView packageName = new TextView(this);\n            packageName.setText(app.packageName);\n            packageName.setTextSize(11);\n            packageName.setTextColor(Color.rgb(125, 125, 125));\n            textBlock.addView(name);\n            textBlock.addView(packageName);\n            row.addView(textBlock, new LinearLayout.LayoutParams(0, dp(58), 1f));\n\n            checkBox.setOnCheckedChangeListener((buttonView, isChecked) -> {\n                if (app.selected == isChecked) return;\n                app.selected = isChecked;\n                adapter.notifyDataSetChanged();\n                updateSelectionState();\n            });\n            row.setOnClickListener(v -> checkBox.setChecked(!checkBox.isChecked()));\n            clonedAppsList.addView(row, new LinearLayout.LayoutParams(\n                    LinearLayout.LayoutParams.MATCH_PARENT, dp(64)));\n\n            View divider = new View(this);\n            divider.setBackgroundColor(Color.rgb(230, 230, 230));\n            clonedAppsList.addView(divider, new LinearLayout.LayoutParams(\n                    LinearLayout.LayoutParams.MATCH_PARENT, 1));\n        }\n    }\n\n'''
          assert marker in s
          s=s.replace(marker, method+marker)
          p.write_text(s)
          print('done',len(s))
          PY
          python3 - <<'PY'
          from pathlib import Path
          g = Path('app/build.gradle.kts')
          s = g.read_text().replace('versionCode = 2', 'versionCode = 5').replace('versionName = "1.2"', 'versionName = "1.5"')
          g.write_text(s)
          m = Path('app/src/main/AndroidManifest.xml')
          s = m.read_text().replace('@android:drawable/sym_def_app_icon', '@drawable/ic_launcher')
          if 'android:roundIcon=' not in s:
              s = s.replace('android:icon="@drawable/ic_launcher"', 'android:icon="@drawable/ic_launcher"\n        android:roundIcon="@drawable/ic_launcher"')
          m.write_text(s)
          PY
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#5B36F2" android:pathData="M20,4 h68 a16,16 0,0 1,16 16 v68 a16,16 0,0 1,-16 16 h-68 a16,16 0,0 1,-16 -16 v-68 a16,16 0,0 1,16 -16 z" />
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="5" android:strokeLineJoin="round" android:pathData="M24,39 h36 a7,7 0,0 1,7 7 v28 a7,7 0,0 1,-7 7 h-36 a7,7 0,0 1,-7 -7 v-28 a7,7 0,0 1,7 -7 z" />
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="5" android:strokeLineJoin="round" android:pathData="M47,25 h35 a7,7 0,0 1,7 7 v28 a7,7 0,0 1,-7 7 h-15 v-21 a7,7 0,0 0,-7 -7 h-20 v-7 a7,7 0,0 1,7 -7 z" />
              <path android:fillColor="#27D8FF" android:pathData="M79,67 a14,14 0,1 0,0.1 0 z" />
              <path android:fillColor="#FFFFFFFF" android:pathData="M74,62 C76,58 83,58 85,62 C87,67 81,70 78,73 H86 V78 H71 V74 C75,70 81,67 81,64 C81,62 78,62 77,65 Z" />
          </vector>
          XML
      - name: Build APK
        run: |
          cd /tmp/project/dualapp999-v1.2-project
          gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DualApp999-v1.5-debug
          path: /tmp/project/dualapp999-v1.2-project/app/build/outputs/apk/debug/*.apk
