name: Build DualApp999 v1.5 APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [dualapp999-build-20260727]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare v1.5 source
        run: |
          base64 -d dualapp-build/project-v1.2.zip.b64 > /tmp/project.zip
          unzip -q /tmp/project.zip -d /tmp/project
          cd /tmp/project/dualapp999-v1.2-project
          base64 -d "$GITHUB_WORKSPACE/dualapp-build/v15-main-final.b64" > app/src/main/java/com/kuku/dualapp/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          g = Path('app/build.gradle.kts')
          s = g.read_text().replace('versionCode = 2', 'versionCode = 5').replace('versionName = "1.2"', 'versionName = "1.5"')
          g.write_text(s)
          m = Path('app/src/main/AndroidManifest.xml')
          s = m.read_text().replace('@android:drawable/sym_def_app_icon', '@drawable/ic_launcher')
          if 'android:roundIcon=' not in s:
              s = s.replace('android:icon="@drawable/ic_launcher"', 'android:icon="@drawable/ic_launcher"\n        android:roundIcon="@drawable/ic_launcher"')
          m.write_text(s)
          PY
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#5B36F2" android:pathData="M20,4 h68 a16,16 0,0 1,16 16 v68 a16,16 0,0 1,-16 16 h-68 a16,16 0,0 1,-16 -16 v-68 a16,16 0,0 1,16 -16 z" />
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="5" android:strokeLineJoin="round" android:pathData="M24,39 h36 a7,7 0,0 1,7 7 v28 a7,7 0,0 1,-7 7 h-36 a7,7 0,0 1,-7 -7 v-28 a7,7 0,0 1,7 -7 z" />
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="5" android:strokeLineJoin="round" android:pathData="M47,25 h35 a7,7 0,0 1,7 7 v28 a7,7 0,0 1,-7 7 h-15 v-21 a7,7 0,0 0,-7 -7 h-20 v-7 a7,7 0,0 1,7 -7 z" />
              <path android:fillColor="#27D8FF" android:pathData="M79,67 a14,14 0,1 0,0.1 0 z" />
              <path android:fillColor="#FFFFFFFF" android:pathData="M74,62 C76,58 83,58 85,62 C87,67 81,70 78,73 H86 V78 H71 V74 C75,70 81,67 81,64 C81,62 78,62 77,65 Z" />
          </vector>
          XML
      - name: Build APK
        run: |
          cd /tmp/project/dualapp999-v1.2-project
          gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DualApp999-v1.5-debug
          path: /tmp/project/dualapp999-v1.2-project/app/build/outputs/apk/debug/*.apk
