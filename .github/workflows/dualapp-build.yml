name: Build DualApp999 APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [dualapp999-build-20260727]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: |
          base64 -d dualapp-build/project-v1.2.zip.b64 > /tmp/project.zip
          unzip -q /tmp/project.zip -d /tmp/project
          cd /tmp/project/dualapp999-v1.2-project
          gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DualApp999-v1.2-debug
          path: /tmp/project/dualapp999-v1.2-project/app/build/outputs/apk/debug/*.apk
