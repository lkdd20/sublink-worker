name: Build DualApp999 APK
on:
  push:
    branches: [dualapp999-build-20260727]
    paths:
      - 'dualapp-build/**'
      - '.github/workflows/dualapp-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: |
          base64 -d dualapp-build/project-v1.2.zip.b64 > /tmp/p.zip
          unzip -q /tmp/p.zip -d /tmp/p
          cd /tmp/p/dualapp999-v1.2-project
          gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DualApp999-v1.2-debug
          path: /tmp/p/dualapp999-v1.2-project/app/build/outputs/apk/debug/*.apk
